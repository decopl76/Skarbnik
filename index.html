<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skarbnik - Zarządzanie Składkami</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; margin-top: 0; color: #1a73e8; }
        .section { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
        .section-title { font-weight: bold; margin-bottom: 10px; display: block; color: #5f6368; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #1557b0; }
        .btn-delete { background-color: #d93025; margin-top: 5px; padding: 6px; font-size: 0.9em; }
        .btn-delete:hover { background-color: #b31412; }
        .person { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 12px; background: #fff; border: 1px solid #f0f0f0; border-radius: 6px; }
        input[type="checkbox"] { transform: scale(1.6); cursor: pointer; margin-right: 15px; }
        label { font-size: 1.1em; flex-grow: 1; cursor: pointer; display: flex; align-items: center; }
        .total { font-size: 1.5em; font-weight: bold; margin-top: 20px; color: #202124; text-align: center; background: #e8f0fe; padding: 15px; border-radius: 8px; border: 1px solid #aecbfa; }
        .stats { font-size: 0.9em; color: #5f6368; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>📊 Skarbnik</h2>
    <div class="section">
        <span class="section-title">📅 Wybierz lub dodaj zbiórkę:</span>
        <select id="event-select" onchange="switchEvent()"></select>
        <input type="text" id="new-event-name" placeholder="Np. Prezent, Kino">
        <button onclick="createNewEvent()">➕ Dodaj nowe wydarzenie</button>
        <button onclick="deleteCurrentEvent()" class="btn-delete">🗑️ Usuń to wydarzenie</button>
    </div>
    
    <!-- DODANE: Okienko do zmiany kwoty składki -->
    <div class="section">
        <span class="section-title">💰 Kwota składki (zł):</span>
        <input type="number" id="event-price-input" value="25" min="0" oninput="updatePrice()">
    </div>

    <h3 id="current-event-title" style="text-align: center; color: #3c4043;"></h3>
    <div id="people-list"></div>
    <div class="total">Suma: <span id="total-amount">0</span> zł</div>
    <div class="stats" id="total-stats">Zaznaczono osób: 0 z 23</div>
</div>
<script>
const studentsList = [
    "Buczak", "Dec", "Falandys", "Gielarowski", "Janusz", 
    "Kieplin", "Kobylarz", "Kot", "Makarowski", "Mastellone", 
    "Matuła", "Nizioł", "A Olechowski", "S Olechowski", "Piersiak", 
    "Pięknoś", "Pustkowski", "Rząsa", "Sondej", "Wawrzaszek", 
    "B Woś", "W Woś", "Zdeb"
];

let appData = JSON.parse(localStorage.getItem('skarbnik_data')) || {
    currentEvent: "Ogólna składka",
    events: { "Ogólna składka": { people: [], price: 25 } }
};

// Funkcja naprawiająca stare dane w pamięci przeglądarki, jeśli istniały
if (appData.events["Ogólna składka"] && Array.isArray(appData.events["Ogólna składka"])) {
    const oldPeople = appData.events["Ogólna składka"];
    appData.events["Ogólna składka"] = { people: oldPeople, price: 25 };
}

function saveData() { localStorage.setItem('skarbnik_data', JSON.stringify(appData)); }

function renderEventSelect() {
    const select = document.getElementById('event-select');
    select.innerHTML = '';
    Object.keys(appData.events).forEach(eventName => {
        const option = document.createElement('option');
        option.value = eventName;
        option.innerText = eventName;
        if(eventName === appData.currentEvent) option.selected = true;
        select.appendChild(option);
    });
}

function createNewEvent() {
    const nameInput = document.getElementById('new-event-name');
    const name = nameInput.value.trim();
    if(name === "") return alert("Wpisz nazwę!");
    if(appData.events[name]) return alert("Już istnieje!");
    
    // Zapisujemy wydarzenie jako obiekt z listą ludzi i ceną
    appData.events[name] = { people: [], price: 25 };
    appData.currentEvent = name;
    nameInput.value = "";
    saveData();
    renderEventSelect();
    loadCurrentEvent();
}

function deleteCurrentEvent() {
    const current = appData.currentEvent;
    if(Object.keys(appData.events).length <= 1) return alert("Musisz mieć min. jedno wydarzenie!");
    if(confirm(`Usunąć zbiórkę: "${current}"?`)) {
        delete appData.events[current];
        appData.currentEvent = Object.keys(appData.events)[0];
        saveData();
        renderEventSelect();
        loadCurrentEvent();
    }
}

function switchEvent() {
    appData.currentEvent = document.getElementById('event-select').value;
    saveData();
    loadCurrentEvent();
}

// DODANE: Funkcja aktualizująca cenę w locie
function updatePrice() {
    const priceInput = document.getElementById('event-price-input');
    let price = parseFloat(priceInput.value);
    if (isNaN(price) || price < 0) price = 0;
    
    appData.events[appData.currentEvent].price = price;
    saveData();
    calculateTotal();
}

function togglePerson(name) {
    const currentEventObj = appData.events[appData.currentEvent];
    const index = currentEventObj.people.indexOf(name);
    if (index === -1) {
        currentEventObj.people.push(name);
    } else {
        currentEventObj.people.splice(index, 1);
    }
    saveData();
    calculateTotal();
}

function calculateTotal() {
    const currentEventObj = appData.events[appData.currentEvent];
    const checkedCount = currentEventObj.people.length;
    const price = currentEventObj.price || 0;
    
    document.getElementById('total-amount').innerText = (checkedCount * price).toFixed(2).replace('.00', '');
    document.getElementById('total-stats').innerText = `Zaznaczono osób: ${checkedCount} z ${studentsList.length}`;
}

function loadCurrentEvent() {
    document.getElementById('current-event-title').innerText = "Zbiórka: " + appData.currentEvent;
    
    // Pobranie danych obecnego wydarzenia i zabezpieczenie przed błędami struktury
    if (!appData.events[appData.currentEvent].people) {
        appData.events[appData.currentEvent] = { people: [], price: 25 };
    }
    
    const currentEventObj = appData.events[appData.currentEvent];
    
    // Ustawienie ceny w polu input
    document.getElementById('event-price-input').value = currentEventObj.price !== undefined ? currentEventObj.price : 25;
    
    const container = document.getElementById('people-list');
    container.innerHTML = '';
    
    studentsList.forEach(student => {
        const isChecked = currentEventObj.people.includes(student);
        const personDiv = document.createElement('div');
        personDiv.className = 'person';
        
        personDiv.innerHTML = `
            <label>
                <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="togglePerson('${student}')">
                ${student}
            </label>
        `;
        container.appendChild(personDiv);
    });
    
    calculateTotal();
}

// Uruchomienie aplikacji przy starcie strony
renderEventSelect();
loadCurrentEvent();
</script>
</body>
</html>
